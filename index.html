<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Assistentes da oficina</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700&display=swap">
<style>
:root{ --bg:#F6F2EC; --paper:#FFFCF8; --ink:#2A211C; --body:#5A5045; --meta:#8D8377; --accent:#E5662C; --accent-ink:#B04A1C; --rule:#E2D9CD; --dark:#1B1512; --cream:#FBEEE5; --ok:#2F7D4F; --erro:#B3261E }
@media (prefers-color-scheme: dark){ :root{ --bg:#1B1512; --paper:#2A211C; --ink:#FBEEE5; --body:#E8DED4; --meta:#A2988C; --accent-ink:#F0A77E; --rule:#4A3F37; --dark:#0F0B09; --ok:#7FCB9B; --erro:#F2B8B5; color-scheme:dark } }
*{ box-sizing:border-box }
[hidden]{ display:none !important }
body{ background:var(--bg); color:var(--body); font-family:'Poppins',system-ui,-apple-system,'Segoe UI',sans-serif; margin:0; padding:0 16px 32px }
.wrap{ max-width:1180px; margin:0 auto }
header{ display:flex; align-items:center; gap:14px; padding:18px 0 10px; border-bottom:1.5px solid var(--accent); flex-wrap:wrap }
header .brand{ font-size:11px; font-weight:700; letter-spacing:.08em; color:var(--ink) }
header .brand span{ display:block; font-size:8px; letter-spacing:.34em; font-weight:400; color:var(--meta) }
header .doc{ margin-left:auto; text-align:right; font-size:9px; letter-spacing:.22em; color:var(--meta); line-height:1.7 }
header .doc b{ color:var(--accent); display:block }
h1{ font-size:clamp(22px,3.2vw,30px); color:var(--ink); margin:18px 0 6px; line-height:1.15 }
h1 em{ color:var(--accent); font-style:normal }
.lede{ font-size:15px; line-height:1.5; max-width:72ch; margin:0 0 18px }
.volta{ display:inline-block; margin-top:14px; font-size:12px; font-weight:700; color:var(--accent-ink); text-decoration:none }
.grid{ display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1.3fr); gap:20px; align-items:start }
@media (max-width:860px){ .grid{ grid-template-columns:1fr } }
.panel{ background:var(--paper); border:1px solid var(--rule); border-radius:10px; padding:16px; min-width:0 }
.panel h2{ font-size:11px; letter-spacing:.22em; text-transform:uppercase; color:var(--meta); margin:0 0 10px }
label{ display:block; font-size:12px; font-weight:700; color:var(--ink); margin:10px 0 4px }
select,textarea,input{ width:100%; font:inherit; font-size:14px; color:var(--ink); background:var(--bg); border:1px solid var(--rule); border-radius:6px; padding:9px 10px }
textarea{ min-height:190px; line-height:1.45; resize:vertical }
textarea.curto{ min-height:74px }
textarea:focus,select:focus,input:focus,button:focus-visible,a:focus-visible{ outline:2px solid var(--accent); outline-offset:1px }
.hint{ font-size:12px; color:var(--meta); line-height:1.45; margin:6px 0 0 }
.row{ display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin-top:12px }
button,a.btn{ font:inherit; font-size:14px; font-weight:700; border:0; border-radius:6px; padding:10px 16px; cursor:pointer; background:var(--accent); color:#fff; text-decoration:none; display:inline-block }
button.sec,a.sec{ background:transparent; color:var(--accent-ink); border:1px solid var(--rule) }
button[disabled]{ opacity:.55; cursor:default }
.status{ font-size:12.5px; color:var(--meta); min-height:18px; margin-top:10px; line-height:1.45 }
.status.erro{ color:var(--erro) } .status.ok{ color:var(--ok) }
.chat{ display:flex; flex-direction:column; gap:12px }
.vazio{ border:1px dashed var(--rule); border-radius:10px; padding:14px; font-size:14px; line-height:1.5 }
.msg{ border-radius:10px; padding:12px 14px; font-size:14px; line-height:1.55; min-width:0; overflow-wrap:anywhere }
.msg .who{ font-size:9px; letter-spacing:.22em; text-transform:uppercase; color:var(--meta); display:block; margin-bottom:6px; font-weight:700 }
.msg.user{ background:var(--bg); border:1px solid var(--rule); white-space:pre-wrap }
.msg.ai{ background:var(--dark); color:var(--cream); border-left:4px solid var(--accent) }
.msg.ai .who{ color:var(--accent) }
.msg.ai .txt{ white-space:pre-wrap }
.msg.ai .tab{ overflow-x:auto; margin:8px 0 }
.msg.ai table{ border-collapse:collapse; font-size:13px; line-height:1.4; min-width:100% }
.msg.ai th,.msg.ai td{ border:1px solid #4A3F37; padding:6px 8px; text-align:left; vertical-align:top; overflow-wrap:normal; word-break:normal }
.msg.ai th{ color:var(--accent); font-size:11px; letter-spacing:.06em; text-transform:uppercase; white-space:nowrap }
.aviso{ font-size:12px; line-height:1.45; color:var(--meta); border-left:3px solid var(--rule); padding:2px 0 2px 10px; margin:12px 0 0 }
details{ margin-top:14px; font-size:13px }
details summary{ cursor:pointer; font-weight:700; color:var(--ink) }
ol.passos{ padding-left:18px; font-size:14px; line-height:1.5; margin:0 }
ol.passos li{ margin-bottom:6px }
.cards{ display:grid; grid-template-columns:repeat(auto-fit,minmax(260px,1fr)); gap:16px }
.card{ background:var(--paper); border:1px solid var(--rule); border-top:4px solid var(--accent); border-radius:10px; padding:18px; display:flex; flex-direction:column }
.card h3{ margin:0 0 6px; color:var(--ink); font-size:17px }
.card .q{ font-size:11px; letter-spacing:.18em; color:var(--meta); text-transform:uppercase; margin:0 0 10px }
.card p{ font-size:14px; line-height:1.5; margin:0 0 14px }
.card .btn{ margin-top:auto; align-self:flex-start }
.acesso{ max-width:460px; margin:9vh auto 0 }
.acesso input{ font-size:18px; letter-spacing:.12em; text-transform:uppercase; text-align:center; padding:12px }
footer{ margin-top:22px; font-size:10px; letter-spacing:.14em; color:var(--meta); display:flex; justify-content:space-between; flex-wrap:wrap; gap:8px }
footer a{ color:var(--meta) }
@media (prefers-reduced-motion: reduce){ *{ transition:none !important; scroll-behavior:auto !important } }
</style>
</head>

/* ---------- utilidades ---------- */
const $ = (s, r) => (r || document).querySelector(s);
function el(tag, attrs, ...filhos){
  const e = document.createElement(tag);
  for (const k in (attrs || {})){
    const v = attrs[k];
    if (k === 'class') e.className = v; else if (k === 'html') e.innerHTML = v;
    else if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
    else if (v === true) e.setAttribute(k, ''); else if (v !== false && v != null) e.setAttribute(k, v);
  }
  for (const f of filhos.flat()){ if (f == null) continue; e.appendChild(typeof f === 'string' ? document.createTextNode(f) : f); }
  return e;
}
const guarda = {
  ler(k){ try { return localStorage.getItem(k); } catch(e){ return null; } },
  gravar(k, v){ try { localStorage.setItem(k, v); } catch(e){} },
  apagar(k){ try { localStorage.removeItem(k); } catch(e){} }
};
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const norm = s => (s || '').toUpperCase().replace(/[^A-Z0-9]/g, '');

/* ---------- abertura do conteúdo com o código de acesso ---------- */
let D = null, IA = null;
async function abrir(codigo){
  const mat = await crypto.subtle.importKey('raw', new TextEncoder().encode(norm(codigo)), 'PBKDF2', false, ['deriveKey']);
  const k = await crypto.subtle.deriveKey({ name:'PBKDF2', salt:b64(COFRE.sal), iterations:COFRE.iter, hash:'SHA-256' }, mat, { name:'AES-GCM', length:256 }, false, ['decrypt']);
  const dec = async b => JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({ name:'AES-GCM', iv:b64(b.iv) }, k, b64(b.ct))));
  D = await dec(COFRE.conteudo);
  IA = COFRE.chave ? await dec(COFRE.chave) : null;
}

/* ---------- consulta ao serviço de IA ---------- */
function modelosEmOrdem(){
  const pref = guarda.ler('pn_modelo'), lista = IA.modelos.slice();
  const i = lista.findIndex(m => m.id === pref);
  if (i > 0) lista.unshift(lista.splice(i, 1)[0]);
  return lista;
}
async function lerFluxo(r, aoTexto, vigia){
  const leitor = r.body.getReader(), dec = new TextDecoder();
  let buf = '', texto = '', fim = null;
  for (;;){
    const { value, done } = await leitor.read();
    if (done) break;
    vigia();
    buf += dec.decode(value, { stream:true });
    let i;
    while ((i = buf.indexOf('\n')) >= 0){
      const linha = buf.slice(0, i).trim(); buf = buf.slice(i + 1);
      if (!linha.startsWith('data:')) continue;
      const d = linha.slice(5).trim();
      if (d === '[DONE]') continue;
      try {
        const c = (JSON.parse(d).choices || [])[0];
        if (c){ if (c.delta && c.delta.content){ texto += c.delta.content; aoTexto(texto); } if (c.finish_reason) fim = c.finish_reason; }
      } catch(e){}
    }
  }
  return { texto, cortada: fim === 'length' };
}
async function consultar(mensagens, aoTexto, ctrl){
  let timer = null;
  const vigia = () => { clearTimeout(timer); timer = setTimeout(() => { ctrl.demora = true; ctrl.abort(); }, IA.espera_ms || 90000); };
  let ultimo = null;
  try {
    for (const m of modelosEmOrdem()){
      const tentativas = Object.keys(m.extras || {}).length && guarda.ler('pn_simples') !== m.id ? [m.extras, {}] : [{}];
      for (let t = 0; t < tentativas.length; t++){
        const corpo = Object.assign({ model:m.id, messages:mensagens, stream:true }, tentativas[t]);
        let r;
        vigia();
        try {
          r = await fetch(IA.url, { method:'POST', headers:{ 'Content-Type':'application/json', 'Authorization':'Bearer ' + IA.chave }, body:JSON.stringify(corpo), signal:ctrl.signal });
        } catch(e){ throw { tipo: e && e.name === 'AbortError' ? (ctrl.demora ? 'demora' : 'cancelada') : 'rede' }; }
        if (r.ok){
          let res;
          try { res = await lerFluxo(r, aoTexto, vigia); }
          catch(e){ throw { tipo: e && e.name === 'AbortError' ? (ctrl.demora ? 'demora' : 'cancelada') : 'rede' }; }
          if (!res.texto.trim()) throw { tipo:'vazia' };
          guarda.gravar('pn_modelo', m.id);
          res.modelo = m.id;
          return res;
        }
        let j = null; try { j = await r.json(); } catch(e){}
        const err = (j && j.error) || {}, pista = [err.message, err.code, err.type, err.param].filter(Boolean).join(' ');
        if (r.status === 401) throw { tipo:'chave' };
        if (r.status === 429) throw { tipo: /quota|billing/i.test(pista) ? 'cota' : 'limite' };
        if (r.status === 400 && t < tentativas.length - 1 && /param|unsupported|unrecognized|unknown|reasoning|max_completion/i.test(pista)){ guarda.gravar('pn_simples', m.id); continue; }
        if (r.status === 404 || r.status === 403 || (r.status === 400 && /model/i.test(pista))){ ultimo = { tipo:'modelo', pista }; break; }
        if (r.status >= 500) throw { tipo:'servico' };
        throw { tipo:'outro', pista };
      }
    }
    throw ultimo || { tipo:'modelo' };
  } finally { clearTimeout(timer); }
}
const FALHAS = {
  rede: 'Sem conexão com o serviço de IA nesta rede. Tente de novo; se continuar, use o texto completo em outra ferramenta (painel 1) e avise o facilitador.',
  demora: 'O serviço de IA demorou além do esperado. Tente de novo.',
  cancelada: 'Consulta interrompida.',
  chave: 'A chave de IA desta página não está ativa. Avise o facilitador. Enquanto isso, use o texto completo em outra ferramenta (painel 1).',
  cota: 'O limite de uso da IA contratado para a oficina foi atingido. Avise o facilitador. Enquanto isso, use o texto completo em outra ferramenta (painel 1).',
  limite: 'Muitas consultas ao mesmo tempo. Aguarde um minuto e tente de novo.',
  servico: 'O serviço de IA está instável. Aguarde um minuto e tente de novo.',
  modelo: 'O modelo de IA configurado não respondeu para esta chave. Avise o facilitador.',
  vazia: 'A IA não devolveu texto nesta consulta. Tente de novo.',
  outro: 'Falha na consulta. Tente de novo em instantes.'
};

/* ---------- exibição da resposta (texto simples, negrito e tabelas) ---------- */
const ehTabela = l => /^\s*\|.*\|\s*$/.test(l);
const ehRegua = l => /^\s*\|?\s*:?-{2,}:?\s*(\|\s*:?-{2,}:?\s*)*\|?\s*$/.test(l);
const celulas = l => l.trim().replace(/^\|/, '').replace(/\|$/, '').split('|').map(c => c.trim());
function emLinha(pai, t){
  t.split(/(\*\*[^*\n]+\*\*)/).forEach(p => {
    if (/^\*\*[^*\n]+\*\*$/.test(p)) pai.appendChild(el('b', null, p.slice(2, -2))); else if (p) pai.appendChild(document.createTextNode(p));
  });
}
function blocos(texto){
  const out = []; let txt = [], tab = [];
  const fechaTxt = () => { if (txt.length){ out.push({ tipo:'txt', linhas:txt }); txt = []; } };
  const fechaTab = () => { if (tab.length){ out.push({ tipo:'tab', linhas:tab.filter(l => !ehRegua(l)).map(celulas) }); tab = []; } };
  for (const l of texto.replace(/\r/g, '').split('\n')){
    if (ehTabela(l)){ fechaTxt(); tab.push(l); } else { fechaTab(); txt.push(l.replace(/^\s{0,3}#{1,6}\s+/, '')); }
  }
  fechaTxt(); fechaTab();
  return out;
}
function formata(texto){
  const f = document.createDocumentFragment();
  for (const b of blocos(texto)){
    if (b.tipo === 'txt'){
      const t = b.linhas.join('\n').replace(/^\n+|\n+$/g, '');
      if (t){ const d = el('div', { class:'txt' }); emLinha(d, t); f.appendChild(d); }
    } else {
      const tb = el('table');
      b.linhas.forEach((cs, i) => { const tr = el('tr'); cs.forEach(c => { const td = el(i === 0 ? 'th' : 'td'); emLinha(td, c); tr.appendChild(td); }); tb.appendChild(tr); });
      f.appendChild(el('div', { class:'tab' }, tb));
    }
  }
  return f;
}
function textoSimples(texto){
  return blocos(texto).map(b => b.tipo === 'txt' ? b.linhas.join('\n').replace(/\*\*([^*\n]+)\*\*/g, '$1') : b.linhas.map(cs => cs.map(c => c.replace(/\*\*/g, '')).join('\t')).join('\n')).join('\n').trim();
}
async function copiar(texto, htmlRico){
  try {
    if (htmlRico && window.ClipboardItem && navigator.clipboard.write){
      await navigator.clipboard.write([new ClipboardItem({ 'text/plain': new Blob([texto], { type:'text/plain' }), 'text/html': new Blob([htmlRico], { type:'text/html' }) })]);
    } else { await navigator.clipboard.writeText(texto); }
    return true;
  } catch(e){
    try { await navigator.clipboard.writeText(texto); return true; } catch(e2){ return false; }
  }
}

/* ---------- telas ---------- */
const app = $('#app');
function cabecalho(sub){
  $('#hd1').textContent = D ? D.cabecalho : 'ASSISTENTES DA OFICINA';
  $('#hd2').textContent = sub;
  $('#ft1').textContent = D ? D.rodape[0] : 'ACESSO RESTRITO AOS PARTICIPANTES DA OFICINA';
  const f2 = $('#ft2'); f2.textContent = '';
  if (D){ f2.appendChild(document.createTextNode(D.rodape[1] + ' · ')); f2.appendChild(el('a', { href:'#/sair' }, 'TROCAR CÓDIGO')); }
  document.title = D ? D.titulo : 'Assistentes da oficina';
}
function telaAcesso(msg){
  D = null; IA = null; cabecalho('ACESSO COM CÓDIGO');
  const campo = el('input', { id:'cod', autocomplete:'off', autocapitalize:'characters', spellcheck:'false', 'aria-label':'Código de acesso', placeholder:'CÓDIGO' });
  const st = el('div', { class:'status' + (msg ? ' erro' : ''), role:'status' }, msg || '');
  const bt = el('button', { type:'submit' }, 'Entrar');
  const form = el('form', { class:'panel acesso', onsubmit: async ev => {
    ev.preventDefault();
    if (!norm(campo.value)){ st.className = 'status erro'; st.textContent = 'Digite o código de acesso.'; return; }
    bt.disabled = true; st.className = 'status'; st.textContent = 'Abrindo...';
    try { await abrir(campo.value); guarda.gravar('pn_codigo', norm(campo.value)); location.hash = '#/'; rota(); }
    catch(e){ bt.disabled = false; st.className = 'status erro'; st.textContent = crypto && crypto.subtle ? 'Código não confere. Verifique com o facilitador.' : 'Este navegador não abre a página. Use Chrome ou Edge atualizados.'; }
  } },
    el('h2', null, 'Assistentes da oficina'),
    el('label', { for:'cod' }, 'Código de acesso informado pelo facilitador'),
    campo, el('div', { class:'row' }, bt), st);
  app.replaceChildren(form); campo.focus();
}
function telaInicio(){
  cabecalho('ASSISTENTES DE MESA');
  const cards = D.assistentes.map(a => el('div', { class:'card' }, el('h3', null, a.nome), el('p', { class:'q' }, a.quando), el('p', null, a.resumo), el('a', { class:'btn', href:'#/' + a.slug }, 'Abrir o assistente')));
  const st = el('div', { class:'status', role:'status' });
  const bt = el('button', { class:'sec', onclick: async () => {
    if (!IA){ st.className = 'status erro'; st.textContent = 'A IA desta página ainda não foi ativada; os assistentes funcionam por copiar e colar.'; return; }
    bt.disabled = true; st.className = 'status'; st.textContent = 'Testando...';
    const t0 = Date.now();
    try {
      const r = await consultar([{ role:'user', content:'Responda apenas com a palavra: funcionando' }], () => {}, new AbortController());
      st.className = 'status ok'; st.textContent = 'IA respondendo nesta rede. Modelo ' + r.modelo + ', ' + ((Date.now() - t0) / 1000).toFixed(1).replace('.', ',') + ' s.';
    } catch(e){ st.className = 'status erro'; st.textContent = FALHAS[e && e.tipo] || FALHAS.outro; }
    bt.disabled = false;
  } }, 'Testar a conexão com a IA');
  app.replaceChildren(
    el('h1', { html: D.inicio.h1 }), el('p', { class:'lede' }, IA ? D.inicio.lede : D.inicio.lede_sem_ia),
    el('div', { class:'cards' }, cards),
    el('div', { class:'panel', style:'margin-top:20px' }, el('h2', null, 'Como usar na oficina'), el('ol', { class:'passos' }, (IA ? D.inicio.passos : D.inicio.passos_sem_ia).map(p => el('li', null, p))), IA ? el('p', { class:'aviso' }, D.aviso) : null),
    el('div', { class:'row' }, bt), st);
}
function telaAssistente(a){
  cabecalho('ASSISTENTE DE MESA · ' + a.quando.toUpperCase());
  let turnos = [], ctrl = null, ocupado = false, avisou = false;
  const sel = el('select', { id:'proj' }, el('option', { value:'' }, 'Escolha o projeto ou escreva abaixo'), D.projetos.map(p => el('option', { value:p.codigo }, p.codigo + ' · ' + p.nome)));
  const dados = el('textarea', { id:'dados', maxlength:'8000', placeholder:'Cole aqui o que a dupla já escreveu na ficha: escopo 2027, critério de sucesso, risco, dependências, orçamento.' });
  const chat = el('div', { class:'chat', 'aria-live':'polite' });
  const st = el('div', { class:'status', role:'status' });
  const seguir = el('textarea', { id:'seguir', class:'curto', maxlength:'4000', placeholder:'Responda às perguntas do assistente ou peça um ajuste.' });
  const btPedir = el('button', null, 'Pedir a proposta'), btEx = el('button', { class:'sec' }, 'Carregar exemplo');
  const btSeguir = el('button', null, 'Enviar resposta'), btCopiar = el('button', { class:'sec' }, 'Copiar a última resposta'), btNova = el('button', { class:'sec' }, 'Nova conversa'), btParar = el('button', { class:'sec', hidden:true }, 'Interromper');
  const continuar = el('div', { hidden:true }, el('label', { for:'seguir' }, 'Sua resposta ao assistente'), seguir, el('div', { class:'row' }, btSeguir, btCopiar, btNova));
  const stC = el('div', { class:'status', role:'status' });
  const btTexto = el('button', { class:'sec' }, 'Copiar o texto completo');
  const completo = () => a.prompt + '\n\nDados informados pelo grupo:\n' + dados.value.trim();
  const diz = (t, tipo) => { st.className = 'status' + (tipo ? ' ' + tipo : ''); st.textContent = t; };
  const pct = v => v == null ? 'não se aplica (projeto novo)' : String(Math.round(v * 10000) / 100).replace('.', ',') + '%';
  const vazio = () => chat.replaceChildren(el('div', { class:'vazio' }, IA ? 'A proposta do assistente aparece aqui. Ele pode fazer perguntas antes de propor; responda no campo que surge abaixo da conversa.' : D.sem_ia.vazio));

  sel.addEventListener('change', () => {
    const p = D.projetos.find(x => x.codigo === sel.value); if (!p) return;
    let t = 'Projeto ' + p.codigo + ' ' + p.nome + ', ' + p.unidade + '.\nEscopo 2027 (escrito pela dupla na ficha): [cole aqui]\nCritério objetivo de sucesso (escrito pela dupla): [cole aqui]';
    if (a.slug === 'calibrador') t += '\nMeta 2026: ' + pct(p.meta) + '. Execução 1º semestre 2026: ' + pct(p.exec1s) + '. Aderência: ' + (p.ad == null ? 'projeto novo (C5 = 3)' : String(p.ad).replace('.', ',')) + '.\nRisco associado na RAE: ' + p.risco + '\nRisco da matriz e tratamento, dependências externas, orçamento e equipe: [a dupla completa]';
    if (a.slug === 'marcos') t += '\nRisco Alto ou Extremo e tratamento previsto (entra como marco): [a dupla completa]\nCronograma e contratos conhecidos: [a dupla completa]';
    if (a.slug === 'ods') t += '\nVinculação de 2026 (se houver): [a dupla completa]';
    dados.value = t; avisou = false;
  });
  btEx.addEventListener('click', () => { dados.value = a.exemplo; sel.value = ''; avisou = false; });

  function bolha(papel, texto){
    const corpo = el('div', { class:'corpo' });
    if (papel === 'user') corpo.textContent = texto; else corpo.appendChild(formata(texto));
    const d = el('div', { class:'msg ' + (papel === 'user' ? 'user' : 'ai') }, el('span', { class:'who' }, papel === 'user' ? 'Grupo' : 'Assistente'), corpo);
    chat.appendChild(d); d.scrollIntoView({ block:'nearest' });
    return corpo;
  }
  function trava(sim){
    ocupado = sim; btPedir.disabled = sim; btSeguir.disabled = sim; btNova.disabled = sim; btCopiar.disabled = sim; btParar.hidden = !sim;
  }
  async function pergunta(texto){
    if (ocupado) return;
    if (!turnos.length) chat.replaceChildren();
    turnos.push({ role:'user', content: turnos.length ? texto : 'Dados informados pelo grupo:\n' + texto });
    bolha('user', texto);
    const corpo = bolha('ai', 'Preparando a resposta...');
    trava(true); diz('Consultando a IA. A resposta aparece aos poucos.');
    ctrl = new AbortController();
    try {
      const r = await consultar([{ role:'system', content: a.prompt + '\n\n' + D.ambiente }].concat(turnos), t => { corpo.replaceChildren(formata(t)); }, ctrl);
      corpo.replaceChildren(formata(r.texto));
      turnos.push({ role:'assistant', content:r.texto });
      continuar.hidden = false;
      diz(r.cortada ? 'A resposta foi cortada por tamanho. Peça a continuação no campo abaixo.' : '');
    } catch(e){
      turnos.pop(); corpo.parentNode.remove(); chat.lastChild && chat.lastChild.remove();
      if (!turnos.length) vazio(); else seguir.value = texto;
      diz(FALHAS[e && e.tipo] || FALHAS.outro, 'erro');
    }
    trava(false);
  }
  btPedir.addEventListener('click', () => {
    const t = dados.value.trim();
    if (!t){ diz('Escolha o projeto ou escreva os dados antes de pedir a proposta.', 'erro'); return; }
    if (!IA) return;
    if (/\[(cole aqui|a dupla completa)\]/.test(t) && !avisou){ avisou = true; diz('Ainda há trechos entre colchetes sem preencher. Complete com o que a dupla escreveu na ficha, ou clique de novo para enviar assim mesmo.', 'erro'); return; }
    turnos = []; continuar.hidden = true; pergunta(t);
  });
  btSeguir.addEventListener('click', () => {
    const t = seguir.value.trim(); if (!t) return;
    if (turnos.filter(x => x.role === 'user').length >= (IA.max_turnos || 12)){ diz('Conversa longa. Clique em Nova conversa para seguir com este ou com outro projeto.', 'erro'); return; }
    seguir.value = ''; pergunta(t);
  });
  seguir.addEventListener('keydown', e => { if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) btSeguir.click(); });
  btParar.addEventListener('click', () => { if (ctrl) ctrl.abort(); });
  btNova.addEventListener('click', () => { turnos = []; continuar.hidden = true; seguir.value = ''; diz(''); vazio(); });
  btCopiar.addEventListener('click', async () => {
    const u = [...turnos].reverse().find(x => x.role === 'assistant'); if (!u) return;
    const tmp = el('div'); tmp.appendChild(formata(u.content));
    tmp.querySelectorAll('.txt').forEach(d => { d.style.whiteSpace = 'pre-wrap'; });
    diz(await copiar(textoSimples(u.content), tmp.innerHTML) ? 'Resposta copiada. Tabelas colam em colunas na planilha.' : 'Selecione o texto da resposta e copie manualmente.');
  });
  btTexto.addEventListener('click', async () => {
    stC.textContent = await copiar(completo()) ? 'Texto completo copiado. Cole na outra ferramenta de IA como uma única mensagem.' : 'Não foi possível copiar. Avise o facilitador.';
  });

  vazio();
  if (!IA){ btPedir.hidden = true; btTexto.className = ''; }
  app.replaceChildren(
    el('a', { class:'volta', href:'#/' }, '← Todos os assistentes'),
    el('h1', { html:a.h1 }), el('p', { class:'lede' }, a.lede),
    el('div', { class:'grid' },
      el('section', { class:'panel' }, el('h2', null, '1 · Dados do projeto'),
        el('label', { for:'proj' }, 'Projeto da carteira (preenche a identificação e os números da RAE)'), sel,
        el('label', { for:'dados' }, 'O que o grupo informa ao assistente'), dados,
        el('p', { class:'hint' }, a.uso),
        el('div', { class:'row' }, btPedir, btEx),
        IA ? el('p', { class:'aviso' }, D.aviso) : null,
        el('details', { open: !IA }, el('summary', null, IA ? 'Sem resposta da IA? Use o texto completo em outra ferramenta' : D.sem_ia.resumo),
          el('p', { class:'hint' }, 'O texto completo reúne as instruções do assistente e os dados acima. Copie e cole em outra ferramenta de IA, como uma única mensagem.'),
          el('div', { class:'row' }, btTexto), stC)),
      el('section', { class:'panel' }, el('h2', null, '2 · Conversa com o assistente'), chat, el('div', { class:'row' }, btParar), st, continuar)));
  window.scrollTo(0, 0);
}

/* ---------- rotas ---------- */
async function rota(){
  const h = location.hash || '#/';
  const m = h.match(/^#c=(.+)$/i);
  if (m){ guarda.gravar('pn_codigo', norm(decodeURIComponent(m[1]))); history.replaceState(null, '', location.pathname + location.search + '#/'); D = null; }
  if (h === '#/sair'){ guarda.apagar('pn_codigo'); history.replaceState(null, '', location.pathname + location.search + '#/'); return telaAcesso(); }
  if (!D){
    const c = guarda.ler('pn_codigo');
    if (!c) return telaAcesso();
    app.replaceChildren(el('p', { class:'lede', style:'margin-top:24px' }, 'Abrindo...'));
    try { await abrir(c); } catch(e){ guarda.apagar('pn_codigo'); return telaAcesso(m ? 'O código do endereço não confere. Digite o código informado pelo facilitador.' : ''); }
  }
  const a = D.assistentes.find(x => '#/' + x.slug === (location.hash || '#/'));
  if (a) telaAssistente(a); else telaInicio();
}
window.addEventListener('hashchange', rota);
rota();
