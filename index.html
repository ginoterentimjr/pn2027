<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Assistentes da oficina</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700&display=swap">
<style>
:root{ --bg:#F6F2EC; --paper:#FFFCF8; --ink:#2A211C; --body:#5A5045; --meta:#8D8377; --accent:#E5662C; --accent-ink:#B04A1C; --rule:#E2D9CD; --dark:#1B1512; --cream:#FBEEE5; --ok:#2F7D4F; --erro:#B3261E }
@media (prefers-color-scheme: dark){ :root{ --bg:#1B1512; --paper:#2A211C; --ink:#FBEEE5; --body:#E8DED4; --meta:#A2988C; --accent-ink:#F0A77E; --rule:#4A3F37; --dark:#0F0B09; --ok:#7FCB9B; --erro:#F2B8B5; color-scheme:dark } }
*{ box-sizing:border-box }
[hidden]{ display:none !important }
body{ background:var(--bg); color:var(--body); font-family:'Poppins',system-ui,-apple-system,'Segoe UI',sans-serif; margin:0; padding:0 16px 32px }
.wrap{ max-width:1180px; margin:0 auto }
header{ display:flex; align-items:center; gap:14px; padding:18px 0 10px; border-bottom:1.5px solid var(--accent); flex-wrap:wrap }
header .brand{ font-size:11px; font-weight:700; letter-spacing:.08em; color:var(--ink) }
header .brand span{ display:block; font-size:8px; letter-spacing:.34em; font-weight:400; color:var(--meta) }
header .doc{ margin-left:auto; text-align:right; font-size:9px; letter-spacing:.22em; color:var(--meta); line-height:1.7 }
header .doc b{ color:var(--accent); display:block }
h1{ font-size:clamp(22px,3.2vw,30px); color:var(--ink); margin:18px 0 6px; line-height:1.15 }
h1 em{ color:var(--accent); font-style:normal }
.lede{ font-size:15px; line-height:1.5; max-width:72ch; margin:0 0 18px }
.volta{ display:inline-block; margin-top:14px; font-size:12px; font-weight:700; color:var(--accent-ink); text-decoration:none }
.grid{ display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1.3fr); gap:20px; align-items:start }
@media (max-width:860px){ .grid{ grid-template-columns:1fr } }
.panel{ background:var(--paper); border:1px solid var(--rule); border-radius:10px; padding:16px; min-width:0 }
.panel h2{ font-size:11px; letter-spacing:.22em; text-transform:uppercase; color:var(--meta); margin:0 0 10px }
label{ display:block; font-size:12px; font-weight:700; color:var(--ink); margin:10px 0 4px }
select,textarea,input{ width:100%; font:inherit; font-size:14px; color:var(--ink); background:var(--bg); border:1px solid var(--rule); border-radius:6px; padding:9px 10px }
textarea{ min-height:190px; line-height:1.45; resize:vertical }
textarea.curto{ min-height:74px }
textarea:focus,select:focus,input:focus,button:focus-visible,a:focus-visible{ outline:2px solid var(--accent); outline-offset:1px }
.hint{ font-size:12px; color:var(--meta); line-height:1.45; margin:6px 0 0 }
.row{ display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin-top:12px }
button,a.btn{ font:inherit; font-size:14px; font-weight:700; border:0; border-radius:6px; padding:10px 16px; cursor:pointer; background:var(--accent); color:#fff; text-decoration:none; display:inline-block }
button.sec,a.sec{ background:transparent; color:var(--accent-ink); border:1px solid var(--rule) }
button[disabled]{ opacity:.55; cursor:default }
.status{ font-size:12.5px; color:var(--meta); min-height:18px; margin-top:10px; line-height:1.45 }
.status.erro{ color:var(--erro) } .status.ok{ color:var(--ok) }
.chat{ display:flex; flex-direction:column; gap:12px }
.vazio{ border:1px dashed var(--rule); border-radius:10px; padding:14px; font-size:14px; line-height:1.5 }
.msg{ border-radius:10px; padding:12px 14px; font-size:14px; line-height:1.55; min-width:0; overflow-wrap:anywhere }
.msg .who{ font-size:9px; letter-spacing:.22em; text-transform:uppercase; color:var(--meta); display:block; margin-bottom:6px; font-weight:700 }
.msg.user{ background:var(--bg); border:1px solid var(--rule); white-space:pre-wrap }
.msg.ai{ background:var(--dark); color:var(--cream); border-left:4px solid var(--accent) }
.msg.ai .who{ color:var(--accent) }
.msg.ai .txt{ white-space:pre-wrap }
.msg.ai .tab{ overflow-x:auto; margin:8px 0 }
.msg.ai table{ border-collapse:collapse; font-size:13px; line-height:1.4; min-width:100% }
.msg.ai th,.msg.ai td{ border:1px solid #4A3F37; padding:6px 8px; text-align:left; vertical-align:top; overflow-wrap:normal; word-break:normal }
.msg.ai th{ color:var(--accent); font-size:11px; letter-spacing:.06em; text-transform:uppercase }
.aviso{ font-size:12px; line-height:1.45; color:var(--meta); border-left:3px solid var(--rule); padding:2px 0 2px 10px; margin:12px 0 0 }
details{ margin-top:14px; font-size:13px }
details summary{ cursor:pointer; font-weight:700; color:var(--ink) }
ol.passos{ padding-left:18px; font-size:14px; line-height:1.5; margin:0 }
ol.passos li{ margin-bottom:6px }
.cards{ display:grid; grid-template-columns:repeat(auto-fit,minmax(260px,1fr)); gap:16px }
.card{ background:var(--paper); border:1px solid var(--rule); border-top:4px solid var(--accent); border-radius:10px; padding:18px; display:flex; flex-direction:column }
.card h3{ margin:0 0 6px; color:var(--ink); font-size:17px }
.card .q{ font-size:11px; letter-spacing:.18em; color:var(--meta); text-transform:uppercase; margin:0 0 10px }
.card p{ font-size:14px; line-height:1.5; margin:0 0 14px }
.card .btn{ margin-top:auto; align-self:flex-start }
.acesso{ max-width:460px; margin:9vh auto 0 }
.acesso input{ font-size:18px; letter-spacing:.12em; text-transform:uppercase; text-align:center; padding:12px }
footer{ margin-top:22px; font-size:10px; letter-spacing:.14em; color:var(--meta); display:flex; justify-content:space-between; flex-wrap:wrap; gap:8px }
footer a{ color:var(--meta) }
.filtros{ display:grid; grid-template-columns:1fr 1fr; gap:10px } @media (max-width:520px){ .filtros{ grid-template-columns:1fr } }
.lab{ display:flex; align-items:center; gap:6px; margin:10px 0 4px } .lab label{ margin:0 }
.q{ width:18px; height:18px; border-radius:50%; border:1.2px solid var(--accent-ink); color:var(--accent-ink); background:transparent; font-size:11px; font-weight:700; padding:0; line-height:1; display:inline-flex; align-items:center; justify-content:center; cursor:pointer; flex:none }
.q[aria-expanded="true"]{ background:var(--accent); border-color:var(--accent); color:#fff }
.pop{ font-size:12.5px; line-height:1.5; color:var(--body); background:var(--bg); border:1px solid var(--rule); border-left:3px solid var(--accent); border-radius:6px; padding:9px 11px; margin:4px 0 8px }
.pop b{ color:var(--ink) }
.panel h2 .q{ margin-left:8px; vertical-align:middle }
.ajuda-bt{ position:fixed; right:18px; bottom:18px; z-index:20; box-shadow:0 6px 18px rgba(0,0,0,.18); border-radius:30px; padding:12px 18px; display:flex; align-items:center; gap:8px }
.ajuda-bt .q{ border-color:#fff; color:#fff; width:20px; height:20px }
.ajuda{ position:fixed; right:0; top:0; bottom:0; width:min(440px,100vw); z-index:30; background:var(--paper); border-left:1px solid var(--rule); box-shadow:-8px 0 24px rgba(0,0,0,.14); display:flex; flex-direction:column; padding:14px 16px }
.ajuda .cab{ display:flex; align-items:center; gap:10px; border-bottom:1.5px solid var(--accent); padding-bottom:10px; margin-bottom:10px }
.ajuda .cab h2{ margin:0; font-size:11px; letter-spacing:.22em; text-transform:uppercase; color:var(--meta); flex:1 }
.ajuda .cab button{ padding:6px 10px; font-size:12px }
.ajuda .chat{ flex:1; overflow:auto; padding-right:4px }
.ajuda .msg{ font-size:13.5px }
.ajuda .msg.ai img{ display:block; width:100%; border-radius:6px; border:1px solid #4A3F37; margin:8px 0 }
.ajuda .msg.ai a{ color:var(--accent); font-weight:700 }
.ajuda .sug{ display:flex; flex-wrap:wrap; gap:6px; margin:8px 0 }
.ajuda .sug button{ font-size:12px; padding:6px 10px; font-weight:400 }
.ajuda form{ display:flex; gap:8px; margin-top:10px; align-items:flex-end }
.ajuda textarea{ min-height:46px; flex:1 }
.ajuda .status{ margin-top:4px }
@media (prefers-reduced-motion: reduce){ *{ transition:none !important; scroll-behavior:auto !important } }
</style>
</head>

/* ---------- utilidades ---------- */
const $ = (s, r) => (r || document).querySelector(s);
function el(tag, attrs, ...filhos){
  const e = document.createElement(tag);
  for (const k in (attrs || {})){
    const v = attrs[k];
    if (k === 'class') e.className = v; else if (k === 'html') e.innerHTML = v;
    else if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
    else if (v === true) e.setAttribute(k, ''); else if (v !== false && v != null) e.setAttribute(k, v);
  }
  for (const f of filhos.flat()){ if (f == null) continue; e.appendChild(typeof f === 'string' ? document.createTextNode(f) : f); }
  return e;
}
const guarda = {
  ler(k){ try { return localStorage.getItem(k); } catch(e){ return null; } },
  gravar(k, v){ try { localStorage.setItem(k, v); } catch(e){} },
  apagar(k){ try { localStorage.removeItem(k); } catch(e){} }
};
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const norm = s => (s || '').toUpperCase().replace(/[^A-Z0-9]/g, '');

/* ---------- abertura do conteúdo com o código de acesso ---------- */
let D = null, IA = null;
async function abrir(codigo){
  const mat = await crypto.subtle.importKey('raw', new TextEncoder().encode(norm(codigo)), 'PBKDF2', false, ['deriveKey']);
  const k = await crypto.subtle.deriveKey({ name:'PBKDF2', salt:b64(COFRE.sal), iterations:COFRE.iter, hash:'SHA-256' }, mat, { name:'AES-GCM', length:256 }, false, ['decrypt']);
  const dec = async b => JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({ name:'AES-GCM', iv:b64(b.iv) }, k, b64(b.ct))));
  D = await dec(COFRE.conteudo);
  IA = COFRE.chave ? await dec(COFRE.chave) : null;
}

/* ---------- consulta ao serviço de IA ---------- */
function modelosEmOrdem(){
  const pref = guarda.ler('pn_modelo'), lista = IA.modelos.slice();
  const i = lista.findIndex(m => m.id === pref);
  if (i > 0) lista.unshift(lista.splice(i, 1)[0]);
  return lista;
}
async function lerFluxo(r, aoTexto, vigia){
  const leitor = r.body.getReader(), dec = new TextDecoder();
  let buf = '', texto = '', fim = null;
  for (;;){
    const { value, done } = await leitor.read();
    if (done) break;
    vigia();
    buf += dec.decode(value, { stream:true });
    let i;
    while ((i = buf.indexOf('\n')) >= 0){
      const linha = buf.slice(0, i).trim(); buf = buf.slice(i + 1);
      if (!linha.startsWith('data:')) continue;
      const d = linha.slice(5).trim();
      if (d === '[DONE]') continue;
      try {
        const c = (JSON.parse(d).choices || [])[0];
        if (c){ if (c.delta && c.delta.content){ texto += c.delta.content; aoTexto(texto); } if (c.finish_reason) fim = c.finish_reason; }
      } catch(e){}
    }
  }
  return { texto, cortada: fim === 'length' };
}
async function consultar(mensagens, aoTexto, ctrl){
  let timer = null;
  const vigia = () => { clearTimeout(timer); timer = setTimeout(() => { ctrl.demora = true; ctrl.abort(); }, IA.espera_ms || 90000); };
  let ultimo = null;
  try {
    for (const m of modelosEmOrdem()){
      const tentativas = Object.keys(m.extras || {}).length && guarda.ler('pn_simples') !== m.id ? [m.extras, {}] : [{}];
      for (let t = 0; t < tentativas.length; t++){
        const corpo = Object.assign({ model:m.id, messages:mensagens, stream:true }, tentativas[t]);
        let r;
        vigia();
        try {
          r = await fetch(IA.url, { method:'POST', headers:{ 'Content-Type':'application/json', 'Authorization':'Bearer ' + IA.chave }, body:JSON.stringify(corpo), signal:ctrl.signal });
        } catch(e){ throw { tipo: e && e.name === 'AbortError' ? (ctrl.demora ? 'demora' : 'cancelada') : 'rede' }; }
        if (r.ok){
          let res;
          try { res = await lerFluxo(r, aoTexto, vigia); }
          catch(e){ throw { tipo: e && e.name === 'AbortError' ? (ctrl.demora ? 'demora' : 'cancelada') : 'rede' }; }
          if (!res.texto.trim()) throw { tipo:'vazia' };
          guarda.gravar('pn_modelo', m.id);
          res.modelo = m.id;
          return res;
        }
        let j = null; try { j = await r.json(); } catch(e){}
        const err = (j && j.error) || {}, pista = [err.message, err.code, err.type, err.param].filter(Boolean).join(' ');
        if (r.status === 401) throw { tipo:'chave' };
        if (r.status === 429) throw { tipo: /quota|billing/i.test(pista) ? 'cota' : 'limite' };
        if (r.status === 400 && t < tentativas.length - 1 && /param|unsupported|unrecognized|unknown|reasoning|max_completion/i.test(pista)){ guarda.gravar('pn_simples', m.id); continue; }
        if (r.status === 404 || r.status === 403 || (r.status === 400 && /model/i.test(pista))){ ultimo = { tipo:'modelo', pista }; break; }
        if (r.status >= 500) throw { tipo:'servico' };
        throw { tipo:'outro', pista };
      }
    }
    throw ultimo || { tipo:'modelo' };
  } finally { clearTimeout(timer); }

/* ---------- exibição da resposta (texto simples, negrito e tabelas) ---------- */
const ehTabela = l => /^\s*\|.*\|\s*$/.test(l);
const ehRegua = l => /^\s*\|?\s*:?-{2,}:?\s*(\|\s*:?-{2,}:?\s*)*\|?\s*$/.test(l);
const celulas = l => l.trim().replace(/^\|/, '').replace(/\|$/, '').split('|').map(c => c.trim());
function emLinha(pai, t){
  t.split(/(\*\*[^*\n]+\*\*)/).forEach(p => {
    if (/^\*\*[^*\n]+\*\*$/.test(p)) pai.appendChild(el('b', null, p.slice(2, -2))); else if (p) pai.appendChild(document.createTextNode(p));
  });
}
function blocos(texto){
  const out = []; let txt = [], tab = [];
  const fechaTxt = () => { if (txt.length){ out.push({ tipo:'txt', linhas:txt }); txt = []; } };
  const fechaTab = () => { if (tab.length){ out.push({ tipo:'tab', linhas:tab.filter(l => !ehRegua(l)).map(celulas) }); tab = []; } };
  for (const l of texto.replace(/\r/g, '').split('\n')){
    if (ehTabela(l)){ fechaTxt(); tab.push(l); } else { fechaTab(); txt.push(l.replace(/^\s{0,3}#{1,6}\s+/, '')); }
  }
  fechaTxt(); fechaTab();
  return out;
}
function formata(texto){
  const f = document.createDocumentFragment();
  for (const b of blocos(texto)){
    if (b.tipo === 'txt'){
      const t = b.linhas.join('\n').replace(/^\n+|\n+$/g, '');
      if (t){ const d = el('div', { class:'txt' }); emLinha(d, t); f.appendChild(d); }
    } else {
      const tb = el('table');
      b.linhas.forEach((cs, i) => { const tr = el('tr'); cs.forEach(c => { const td = el(i === 0 ? 'th' : 'td'); emLinha(td, c); tr.appendChild(td); }); tb.appendChild(tr); });
      f.appendChild(el('div', { class:'tab' }, tb));
    }
  }
  return f;
}
function textoSimples(texto){
  return blocos(texto).map(b => b.tipo === 'txt' ? b.linhas.join('\n').replace(/\*\*([^*\n]+)\*\*/g, '$1') : b.linhas.map(cs => cs.map(c => c.replace(/\*\*/g, '')).join('\t')).join('\n')).join('\n').trim();
}
async function copiar(texto, htmlRico){
  try {
    if (htmlRico && window.ClipboardItem && navigator.clipboard.write){
      await navigator.clipboard.write([new ClipboardItem({ 'text/plain': new Blob([texto], { type:'text/plain' }), 'text/html': new Blob([htmlRico], { type:'text/html' }) })]);
    } else { await navigator.clipboard.writeText(texto); }
    return true;
  } catch(e){
    try { await navigator.clipboard.writeText(texto); return true; } catch(e2){ return false; }
  }
}

    if (!c) return telaAcesso();
    app.replaceChildren(el('p', { class:'lede', style:'margin-top:24px' }, 'Abrindo...'));
    try { await abrir(c); } catch(e){ guarda.apagar('pn_codigo'); return telaAcesso(m ? 'O código do endereço não confere. Digite o código informado pelo facilitador.' : ''); }
  }
  const a = D.assistentes.find(x => '#/' + x.slug === (location.hash || '#/'));
  if (a) telaAssistente(a); else telaInicio();
}
window.addEventListener('hashchange', rota);
rota();
</script>
